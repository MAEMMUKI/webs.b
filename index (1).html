<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Maemuki · Borradores</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Outfit:wght@400;500&display=swap">
<style>
:root{--bg:#f6f3ff;--ink:#1c1830;--muted:#5d5878;--line:#dcd6f2;--accent:#5b3fd6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;padding:24px}
main{max-width:460px;width:100%}
h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:40px;margin:0 0 6px}
p{color:var(--muted);margin:0 0 24px}
a{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;text-decoration:none;color:var(--ink);font-weight:500;margin-bottom:10px}
a span{color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>Maemuki</h1>
  <p>Borradores de páginas web para negocios.</p>
  <a href="oasis/">Oasis Helados con Queso <span>→</span></a>
</main>
</body>
</html>
